name: CrazyWork
options:
  bundleIdPrefix: com.dmbritton
  deploymentTarget:
    iOS: "18.0"
packages:
  ChallengeCore:
    path: ../ChallengeCore
targets:
  CrazyWork:
    type: application
    platform: iOS
    settings:
      base:
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: "7684T6LK27"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Sources/App/CrazyWork.entitlements
    sources: [Sources]
    dependencies:
      - package: ChallengeCore
      - target: CrazyWorkWatch
    scheme:
      testTargets:
        - CrazyWorkTests
      storeKitConfiguration: Sources/Products.storekit
    info:
      path: Sources/App/Info.plist
      properties:
        NSCameraUsageDescription: "CrazyWork uses the camera to count your reps and check your form."
        NSHealthShareUsageDescription: "CrazyWork reads your body metrics to estimate calories burned."
        NSHealthUpdateUsageDescription: "CrazyWork saves your completed workouts to Apple Health."
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
        UILaunchScreen: {}
  CrazyWorkWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    settings:
      base:
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: "7684T6LK27"
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.dmbritton.CrazyWork.watchkitapp
        CODE_SIGN_ENTITLEMENTS: WatchSources/CrazyWorkWatch.entitlements
    sources:
      - WatchSources
      - Sources/Shared
    info:
      path: WatchSources/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.dmbritton.CrazyWork
        NSHealthShareUsageDescription: "CrazyWork measures your heart rate during workouts."
        NSHealthUpdateUsageDescription: "CrazyWork saves your workouts to Apple Health."
  CrazyWorkTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    sources: [Tests]
    dependencies:
      - target: CrazyWork
      - package: ChallengeCore
